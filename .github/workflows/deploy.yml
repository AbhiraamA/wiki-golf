name: Deploy

# Phase 5: deploy the Worker + built front end to the free workers.dev address on every push to
# main (plan.md §9 "Workflows"). Applies D1 migrations to the remote database first, then deploys
# with ENVIRONMENT=production so only approved holes are served.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24' # Node 22 ships npm 10, which rejects the npm 11 lockfile
          cache: npm
      - run: npm ci
      - name: Build front end
        run: npm run build # -> web/dist, served as Workers Static Assets
      - name: Apply D1 migrations (remote)
        working-directory: worker
        run: npx wrangler d1 migrations apply wiki-golf --remote
      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy --var ENVIRONMENT:production
      # One-time owner setup (not done here): a strong production cookie secret, set with
      #   cd worker && npx wrangler secret put COOKIE_SECRET
      # Until then the Worker falls back to the insecure dev value in wrangler.jsonc.
