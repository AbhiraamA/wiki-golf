name: Build holes

on:
  workflow_dispatch:
    inputs:
      wiki:
        description: Wiki to build from
        type: choice
        options: [simplewiki, enwiki]
        default: simplewiki
      days:
        description: Number of days of holes
        type: number
        default: 30
      start:
        description: First date (YYYY-MM-DD), or "auto" for the day after the last hole
        type: string
        default: auto
      dump_date:
        description: Dump folder date (YYYYMMDD); empty for the newest complete dump
        type: string
        default: ''
      upload:
        description: Upload to R2
        type: boolean
        default: true
      reset:
        description: Delete this wiki's existing holes first, so the build replaces them
        type: boolean
        default: false
  schedule:
    # Monthly, a few days after the 1st-of-month dumps usually finish.
    - cron: '0 6 5 * *'

permissions:
  contents: read

concurrency:
  group: build-holes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      WIKI: ${{ inputs.wiki || vars.HOLES_WIKI || 'simplewiki' }}
      DAYS: ${{ inputs.days || 30 }}
      START: ${{ inputs.start || 'auto' }}
      DUMP_DATE: ${{ inputs.dump_date }}
      UPLOAD: ${{ github.event_name == 'schedule' || inputs.upload }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: builder/pyproject.toml
      # Editable install so the package reads shared/config.json and builder/blocklist.txt
      # from the checked-out repo tree (they live outside the package directory).
      - run: pip install -e ./builder
      - name: Reset existing holes
        if: ${{ inputs.reset }}
        run: python -m wikigolf_builder clear --wiki "$WIKI" --apply
      - name: Build holes
        run: |
          args=(build --wiki "$WIKI" --days "$DAYS" --start "$START" --out "$RUNNER_TEMP/out")
          if [ -n "$DUMP_DATE" ]; then args+=(--dump-date "$DUMP_DATE"); fi
          if [ "$UPLOAD" = "true" ]; then args+=(--upload); fi
          python -m wikigolf_builder "${args[@]}"
      - name: Disk usage
        if: always()
        run: |
          {
            echo ''
            echo '### Disk'
            echo '```'
            df -h / "$RUNNER_TEMP"
            du -sh "$RUNNER_TEMP/out" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
